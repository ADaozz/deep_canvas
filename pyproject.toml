[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-console-backend"
version = "0.1.0"
description = "Async backend for a reusable agent console"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "alembic>=1.14.0",
  "asyncpg>=0.30.0",
  "deepagents",
  "fastapi>=0.115.0",
  "greenlet>=3.1.0",
  "langchain-core>=0.3.0",
  "langchain-openai>=0.3.0",
  "pydantic-settings>=2.6.0",
  "sqlalchemy>=2.0.36",
  "tavily-python>=0.7.0",
  "uvicorn[standard]>=0.32.0",
]

[tool.setuptools.packages.find]
where = ["backend"]
